name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      qtm_full_assets:
        description: Require the versioned complete QTM release-asset cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 魔方拍照解

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical version and release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args=(--tag "$RELEASE_TAG"); fi
          VERSION=$(python release/check_version.py "${args[@]}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (Ruff)
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 魔方拍照解/pyproject.toml

      - name: Install development tools
        run: python -m pip install --upgrade pip -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

  python-tests:
    name: Python ${{ matrix.python-version }}
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 魔方拍照解/pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -e ".[dev]"

      - name: Run Python tests and report skips
        if: matrix.python-version != '3.12'
        run: pytest -ra -m "not native_pdb and not native_slow and not qtm_native and not qtm_full_assets"

      - name: Run stable HTM and shared branch coverage gate
        if: matrix.python-version == '3.12'
        run: >-
          pytest -ra
          -m "not native_binary and not native_pdb and not native_slow and not qtm_native and not qtm_full_assets and not vision_real"
          --cov --cov-branch --cov-report=term-missing

      - name: Compile Python sources
        run: python -m compileall -q cube_app server.py windows_launcher.py

      - name: Build and verify installed wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m pip wheel . --no-deps --wheel-dir .cache/wheel
          python tests/check_wheel_install.py .cache/wheel

  frontend-tests:
    name: Frontend (Node.js 20)
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run frontend tests
        run: |
          node tests/recognition.test.js
          node tests/color.test.js
          node tests/two_by_two_color.test.js
          node tests/solver_ui.test.js

  native-windows:
    name: Native solver (Windows / UCRT64)
    needs: version-check
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 魔方拍照解/pyproject.toml

      - name: Set up MSYS2 UCRT64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-gcc

      - name: Install Python and release dependencies
        run: python -m pip install --upgrade pip -e ".[dev,release]"

      - name: Check C++ formatting
        run: |
          $clangFormat = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\clang-format.exe"
          $files = Get-ChildItem native\htm\src, native\htm\include, native\qtm\src, native\qtm\include -Recurse -File -Include *.cpp, *.hpp
          & $clangFormat --dry-run --Werror --style=file $files.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "clang-format check failed with exit code $LASTEXITCODE"
          }

      - name: Build native solver
        run: .\native\htm\build.ps1 -Portable -Compiler "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\g++.exe"

      - name: Run required native binary tests
        env:
          REQUIRE_NATIVE_BINARY: "1"
        run: pytest -ra -m native_binary

      - name: Restore native PDB cache
        id: native-pdb-cache
        uses: actions/cache@v4
        with:
          path: 魔方拍照解/assets/htm/v1
          key: htm-full-v1-${{ runner.os }}-ucrt64-${{ hashFiles('魔方拍照解/native/htm/src/**', '魔方拍照解/native/htm/include/**', '魔方拍照解/native/htm/build_tables.ps1') }}

      - name: Build required PDBs on cache miss
        if: steps.native-pdb-cache.outputs.cache-hit != 'true'
        run: .\native\htm\build_tables.ps1

      - name: Prepare separate HTM runtime caches
        run: |
          New-Item -ItemType Directory -Force .cache\htm | Out-Null
          $env:CUBE_NATIVE_COORDINATE_CACHE = (Join-Path (Get-Location).Path ".cache\htm\coordinates_htm_v1.bin")
          .\native\htm\build\cube_solver_htm.exe check-heuristic --depth 0
          python -c "from cube_app.solvers.htm.tables import load_or_build_tables; load_or_build_tables('.cache/htm')"
          python -m cube_app.solvers.htm.two_by_two_tables --cache-dir .cache/htm

      - name: Verify required native assets
        run: |
          $required = @(
            "native\htm\build\cube_solver_htm.exe",
            "assets\htm\v1\corner_htm_v2.pdb",
            "assets\htm\v1\phase1_sym_htm_v2.pdb",
            "assets\htm\v1\tail_depth6_v4.pdb"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required native CI asset is missing: $path"
            }
          }

      - name: Run required native PDB tests
        env:
          REQUIRE_NATIVE_PDB: "1"
        run: pytest -ra -m native_pdb

      - name: Build Windows portable package
        run: .\release\build_windows.ps1 -Profile HtmFull -Python python -SkipNativeBuild -SkipTableBuild

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: RubicPhotoSolve-${{ needs.version-check.outputs.version }}-windows-x64
          path: 魔方拍照解/dist/HtmFull/RubicPhotoSolve-*-HtmFull-windows-x64.zip
          if-no-files-found: error

  qtm-windows:
    name: Independent QTM (Portable / bounded native oracle)
    needs: version-check
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 魔方拍照解/pyproject.toml
      - name: Set up QTM compiler
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build independent Portable QTM executable
        run: .\native\qtm\build.ps1 -Portable -Compiler "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\g++.exe"
      - name: Run required bounded QTM native and lifecycle gates
        env:
          REQUIRE_QTM_BINARY: "1"
        run: >-
          python -m pytest -ra tests/test_native_qtm.py tests/test_qtm_speed_contract.py
          tests/test_isolation_contract.py tests/test_qtm_backend.py
          -m "not qtm_full_assets" --junitxml=.cache/qtm-native.xml
      - name: Restore versioned full QTM release assets
        if: github.event_name == 'workflow_dispatch' && inputs.qtm_full_assets
        id: qtm-assets
        uses: actions/cache/restore@v4
        with:
          path: 魔方拍照解/assets/qtm/v1
          key: qtm-strong-v4-tail8-${{ needs.version-check.outputs.version }}-${{ runner.os }}
      - name: Require complete QTM cache for release gate
        if: github.event_name == 'workflow_dispatch' && inputs.qtm_full_assets
        env:
          REQUIRE_QTM_BINARY: "1"
          REQUIRE_QTM_STRONG: "1"
        run: python -m pytest -ra tests/test_native_qtm.py -m qtm_full_assets --junitxml=.cache/qtm-full.xml
      - name: Upload QTM gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qtm-native-gates
          path: 魔方拍照解/.cache/qtm-*.xml
          if-no-files-found: error
          include-hidden-files: true

  prepare-release-draft:
    name: Prepare release draft after checks
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, lint, python-tests, frontend-tests, native-windows, qtm-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Reserve draft without publishing an incomplete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Cube Lens $RELEASE_TAG" \
              --notes "Release checks passed. Attach the verified integrated QtmStrong portable, minimal source and SHA256SUMS before publishing."
          fi
