[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rubic-photo-solve"
description = "Local 2x2 and 3x3 Rubik's cube photo solver"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dynamic = ["version"]
dependencies = [
    "numpy==2.2.6; python_version < '3.12'",
    "numpy==2.5.1; python_version >= '3.12'",
    "opencv-python==5.0.0.93",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.21",
]
release = [
    "pyinstaller==6.21.0",
]

[tool.setuptools.packages.find]
include = ["cube_app", "cube_app.solvers", "cube_app.solvers.htm", "cube_app.solvers.qtm", "cube_app.service"]

[tool.setuptools.dynamic]
version = {attr = "cube_app.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "native_binary: requires the compiled native solver executable",
    "native_pdb: requires the native solver plus the corner and phase-1 PDBs",
    "qtm_native: requires the independently compiled QTM solver; bounded fixtures only",
    "qtm_full_assets: requires the verified complete QTM strong release assets",
    "vision_real: uses tracked photo fixtures or optional original-photo collections",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["initial", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/benchmark_solver.py" = ["E402"]
"tests/benchmark_native.py" = ["E402"]
"tests/extract_real_patches.py" = ["E402"]
"tests/test_hybrid_api.py" = ["E402"]
"tests/test_solver.py" = ["E402"]
"tests/test_two_by_two.py" = ["E402"]
# Frozen review scripts retain the exact bytes used to collect their evidence.
"docs/benchmarks/htm-review-2026-10-05/diagnose.py" = ["E402", "E701", "F401"]
"docs/benchmarks/htm-review-2026-10-05/incumbent_probe.py" = ["E402", "E701", "E702"]

[tool.coverage.run]
branch = true
# HTM and shared production path; QTM correctness and lifecycle
# are checked separately. Include extracted server implementation modules.
source = [
    "cube_app.solvers.htm", "cube_app.solvers.resource_broker",
    "cube_app.cubie", "cube_app.detection", "cube_app.vision",
    "cube_app.runtime", "cube_app.metrics", "cube_app.service", "server",
]

[tool.coverage.report]
fail_under = 70
precision = 1
show_missing = true
skip_covered = true
